[project]
name = "multi-modal-image-analysis-and-generation-platform-backend"
version = "0.1.0"
description = "Backend for Multi-Modal Image Analysis and Generation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.9",
    "fastapi>=0.124.4",
    "google-genai>=1.56.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.2.3",
    "openai>=2.14.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "replicate>=1.0.7",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
